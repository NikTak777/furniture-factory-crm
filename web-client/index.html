<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FurnirureCRM — Вход в систему</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="page-centered">
      <div class="card">
        <div class="brand">
          <div class="brand-badge">FF</div>
          <div>
            <div style="font-weight: 700; letter-spacing: 0.02em">FurnirureCRM</div>
            <div style="color: var(--muted); font-size: 0.85rem">
              Веб‑клиент мебельной фабрики
            </div>
          </div>
        </div>
        <h1>Вход в систему</h1>
        <p class="subtitle">
          Войдите под учётной записью сотрудника.
        </p>

        <div class="field">
          <label class="label" for="login">Логин</label>
          <input id="login" type="text" autocomplete="username" />
        </div>
        <div class="field">
          <label class="label" for="password">Пароль</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>

        <button type="button" class="btn btn-primary" id="btn-login">Войти</button>
        <div class="msg" id="msg" aria-live="polite"></div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script>
      (function () {
        const msg = document.getElementById("msg");
        const btn = document.getElementById("btn-login");

        function setBusy(busy) {
          btn.disabled = busy;
          btn.textContent = busy ? "Вход…" : "Войти";
        }

        function showError(text) {
          msg.className = "msg error";
          msg.textContent = text || "Ошибка входа.";
        }

        async function doLogin() {
          msg.className = "msg";
          msg.textContent = "";

          const login = document.getElementById("login").value.trim();
          const password = document.getElementById("password").value;

          if (!login || !password) {
            showError("Введите логин и пароль.");
            return;
          }

          setBusy(true);
          try {
            const res = await fetch(`${CRM_API_BASE.replace(/\/$/, "")}/auth/login`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Accept: "application/json",
              },
              body: JSON.stringify({ Login: login, Password: password }),
            });

            const text = await res.text();
            let data = null;
            if (text) {
              try {
                data = JSON.parse(text);
              } catch {
                data = text;
              }
            }

            if (!res.ok) {
              const detail =
                typeof data === "string"
                  ? data
                  : data?.title || data?.detail || text || res.statusText;
              showError(detail || `Ошибка ${res.status}`);
              return;
            }

            const user = parseAuthUser(data);
            if (!user) {
              showError("Не удалось разобрать ответ сервера. Попробуйте ещё раз.");
              return;
            }

            setStoredUser(user);

            if (isDirectorRole(user.position)) {
              window.location.href = "director.html";
              return;
            }
            if (isManagerRole(user.position)) {
              window.location.href = "manager.html";
              return;
            }
            if (isWarehouseRole(user.position)) {
              window.location.href = "warehouse.html";
              return;
            }

            clearStoredUser();
            showError(
              "У вас роль «" +
                user.position +
                "». Веб‑интерфейс настроен для директора, менеджера или кладовщика."
            );
          } catch (e) {
            showError(
              "Не удаётся связаться с сервером. Попробуйте позже."
            );
          } finally {
            setBusy(false);
          }
        }

        btn.addEventListener("click", doLogin);
        document.getElementById("password").addEventListener("keydown", (e) => {
          if (e.key === "Enter") doLogin();
        });
        document.getElementById("login").addEventListener("keydown", (e) => {
          if (e.key === "Enter") doLogin();
        });
      })();
    </script>
  </body>
</html>
