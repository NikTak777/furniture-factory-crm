<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FurnitureCRM — Вход в систему</title>
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body>
    <div class="page-centered">
      <div class="card">
        <div class="brand">
          <div class="brand-badge">FC</div>
          <div>
            <div style="font-weight: 700; letter-spacing: 0.02em">FurnitureCRM</div>
            <div style="color: var(--muted); font-size: 0.85rem">
              Веб‑клиент мебельной фабрики
            </div>
          </div>
        </div>
        <h1>Вход в систему</h1>
        <p class="subtitle">
          Войдите под учётной записью сотрудника.
        </p>

        <div class="field">
          <label class="label" for="login">Логин</label>
          <input id="login" type="text" autocomplete="username" />
        </div>
        <div class="field">
          <label class="label" for="password">Пароль</label>
          <input id="password" type="password" autocomplete="current-password" />
        </div>

        <button type="button" class="btn btn-primary" id="btn-login">Войти</button>
        <div class="msg" id="msg" aria-live="polite"></div>
      </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/login.js"></script>
  </body>
</html>
